name: Supabase Keep-Alive

on:
  schedule:
    # Roda a cada 2 dias às 12:00 UTC para garantir que o banco nunca fique inativo
    - cron: '0 12 */2 * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Endpoint
        run: |
          echo "Pinging keep-alive endpoint..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://calculadora-pro-ten.vercel.app/api/keep-alive)
          echo "Response:"
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$status" -ne 200 ]; then
            echo "Keep-alive ping failed with status $status"
            exit 1
          fi
          echo "Ping successful! Supabase kept alive."
